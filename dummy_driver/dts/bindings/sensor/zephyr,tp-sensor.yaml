description: Capteur de temperature simule pour un TP

compatible: "zephyr,tp-sensor"

include : [sensor-device.yaml]

properties:
  initial-millicelsius:
    type: int
    default: 0
    description: Valeur initiale du capteur

  maximum-millicelsius:
    type: int
    default: 100000
    description: Valeur maximale du capteur
